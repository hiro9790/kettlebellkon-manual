<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 640" width="480" height="640" role="img" aria-labelledby="title desc">
  <title id="title">側面から見た装着姿</title>
  <desc id="desc">キャリアを背負った人物の側面図。キャリアは背中の上部に装着する。仮画像。</desc>
  <style>
    text { font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif; }
    .label { font-size: 26px; font-weight: 700; fill: #fff; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#d4202a"/>
    </marker>
  </defs>

  <rect width="480" height="640" fill="#fafafa"/>

  <!-- Torso (facing left) -->
  <path d="M196 160 L196 190 C172 196 158 214 156 240 C152 290 164 330 166 370 C168 420 160 450 162 640 L300 640 C298 470 292 420 290 380 C288 330 298 290 292 240 C288 205 264 190 240 186 L236 160 Z" fill="#d6d6d6" stroke="#c2c2c2" stroke-width="2"/>
  <!-- Head (faceless) -->
  <circle cx="210" cy="118" r="46" fill="#d6d6d6" stroke="#c2c2c2" stroke-width="2"/>

  <!-- Carrier high on the upper back -->
  <rect x="284" y="196" width="50" height="190" rx="12" fill="#141414" transform="rotate(4 309 291)"/>
  <!-- Shoulder strap: over the shoulder, down the chest, back under the arm -->
  <path d="M176 330 C204 350 250 362 292 370" fill="none" stroke="#141414" stroke-width="14" stroke-linecap="round"/>
  <path d="M294 206 C264 180 208 186 188 214 C174 240 172 290 176 330" fill="none" stroke="#141414" stroke-width="18" stroke-linecap="round"/>

  <!-- Arm -->
  <path d="M236 214 C246 280 244 340 232 440" fill="none" stroke="#c2c2c2" stroke-width="38" stroke-linecap="round"/>
  <path d="M236 214 C246 280 244 340 232 440" fill="none" stroke="#d6d6d6" stroke-width="34" stroke-linecap="round"/>

  <!-- Upper-back bracket -->
  <path d="M348 198 H366 V388 H348" fill="none" stroke="#d4202a" stroke-width="4" stroke-linejoin="round"/>

  <!-- Callout -->
  <line x1="392" y1="68" x2="372" y2="236" stroke="#d4202a" stroke-width="4" marker-end="url(#ar)"/>
  <rect x="226" y="12" width="240" height="54" rx="27" fill="#d4202a"/>
  <text class="label" x="346" y="48" text-anchor="middle">背中の上部に装着</text>
</svg>
