<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" role="img" aria-labelledby="title desc">
  <title id="title">枚数別の装着方法</title>
  <desc id="desc">1枚: プレートをポケット1に入れ、ストラップはポケット2の内側で固定。2枚: プレート2枚をポケット1に入れ、ストラップはポケット2の外側で固定。3枚: プレート2枚をポケット1、1枚をポケット2に入れ、ストラップはポケット2の外側で固定。仮画像。</desc>
  <style>
    text { font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif; fill: #111; }
    .h1 { font-size: 32px; font-weight: 700; }
    .legend { font-size: 20px; fill: #333; }
    .count { font-size: 40px; font-weight: 700; }
    .model { font-size: 18px; fill: #666; letter-spacing: 0.5px; }
    .kg { font-size: 19px; font-weight: 700; fill: #fff; }
    .num { font-size: 20px; font-weight: 700; fill: #fff; }
    .small-b { font-size: 17px; font-weight: 700; fill: #1e63d6; }
    .small-r { font-size: 17px; font-weight: 700; fill: #d4202a; }
    .main { font-size: 25px; font-weight: 700; }
    .blue { stroke: #1e63d6; }
    .red { stroke: #d4202a; }
  </style>
  <defs>
    <pattern id="hook" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#4a4a4a"/>
      <path d="M0 6 L6 0" stroke="#666" stroke-width="1.5"/>
    </pattern>
    <!-- Plate, 92 x 138, blue outline = plate -->
    <g id="plate">
      <rect x="1.5" y="1.5" width="89" height="135" rx="14" fill="#121212" stroke="#1e63d6" stroke-width="3"/>
      <rect x="22" y="16" width="48" height="14" rx="7" fill="#2c2c2c"/>
      <rect x="22" y="108" width="48" height="14" rx="7" fill="#2c2c2c"/>
      <text class="kg" x="46" y="76" text-anchor="middle">5 KG</text>
    </g>
    <!-- Opened carrier: straps, body, pocket 1 lining -->
    <g id="carrier">
      <path d="M112 222 C112 176 142 176 142 222" fill="none" stroke="#141414" stroke-width="12" stroke-linecap="round"/>
      <path d="M178 222 C178 176 208 176 208 222" fill="none" stroke="#141414" stroke-width="12" stroke-linecap="round"/>
      <rect x="80" y="210" width="160" height="262" rx="18" fill="#141414"/>
      <rect x="94" y="226" width="132" height="232" rx="9" fill="#2c2c2c"/>
    </g>
    <!-- Pocket 2 front sleeve (semi-transparent so contents read as "inside") -->
    <g id="pocket2">
      <path d="M94 340 H226 V449 Q226 458 217 458 H103 Q94 458 94 449 Z" fill="#3a3a3a" fill-opacity="0.82"/>
      <line x1="94" y1="340" x2="226" y2="340" stroke="#888" stroke-width="3"/>
    </g>
    <!-- Strap, red outline = strap -->
    <g id="strap-in">
      <rect x="146" y="226" width="28" height="146" rx="4" fill="#0c0c0c" stroke="#d4202a" stroke-width="3"/>
      <rect x="149" y="340" width="22" height="29" fill="url(#hook)"/>
    </g>
    <g id="strap-out">
      <rect x="146" y="226" width="28" height="210" rx="4" fill="#0c0c0c" stroke="#d4202a" stroke-width="3"/>
      <rect x="149" y="404" width="22" height="29" fill="url(#hook)"/>
    </g>
  </defs>

  <rect width="960" height="720" fill="#fff"/>

  <!-- Title + legend -->
  <text class="h1" x="28" y="54">枚数別の装着方法</text>
  <rect x="668" y="38" width="18" height="18" rx="3" fill="#fff" stroke="#1e63d6" stroke-width="3"/>
  <text class="legend" x="694" y="55">プレート</text>
  <rect x="800" y="38" width="18" height="18" rx="3" fill="#fff" stroke="#d4202a" stroke-width="3"/>
  <text class="legend" x="826" y="55">ストラップ</text>
  <line x1="20" y1="80" x2="940" y2="80" stroke="#ddd" stroke-width="2"/>
  <line x1="320" y1="96" x2="320" y2="700" stroke="#e2e2e2" stroke-width="2"/>
  <line x1="640" y1="96" x2="640" y2="700" stroke="#e2e2e2" stroke-width="2"/>

  <!-- 1 plate -->
  <g>
    <text class="count" x="160" y="132" text-anchor="middle">1枚</text>
    <text class="model" x="160" y="160" text-anchor="middle">KB-RUCR05</text>
    <use href="#carrier"/>
    <use href="#plate" x="114" y="244"/>
    <use href="#strap-in"/>
    <use href="#pocket2"/>
    <line class="blue" x1="200" y1="276" x2="272" y2="276" stroke-width="3"/>
    <circle cx="200" cy="276" r="6" fill="#1e63d6" stroke="#fff" stroke-width="2"/>
    <circle cx="272" cy="276" r="17" fill="#1e63d6"/>
    <text class="num" x="272" y="283" text-anchor="middle">1</text>
    <line class="red" x1="174" y1="362" x2="272" y2="362" stroke-width="3"/>
    <circle cx="174" cy="362" r="6" fill="#d4202a" stroke="#fff" stroke-width="2"/>
    <circle cx="272" cy="362" r="17" fill="#d4202a"/>
    <text class="num" x="272" y="369" text-anchor="middle">2</text>

    <rect x="16" y="496" width="288" height="62" rx="8" fill="#fff" stroke="#1e63d6" stroke-width="2.5"/>
    <circle cx="46" cy="527" r="16" fill="#1e63d6"/>
    <text class="num" x="46" y="534" text-anchor="middle">1</text>
    <text class="small-b" x="76" y="520">プレート</text>
    <text class="main" x="76" y="548">ポケット1に1枚</text>

    <rect x="16" y="568" width="288" height="62" rx="8" fill="#fff" stroke="#d4202a" stroke-width="2.5"/>
    <circle cx="46" cy="599" r="16" fill="#d4202a"/>
    <text class="num" x="46" y="606" text-anchor="middle">2</text>
    <text class="small-r" x="76" y="592">ストラップ</text>
    <text class="main" x="76" y="620">ポケット2の内側</text>
  </g>

  <!-- 2 plates -->
  <g transform="translate(320 0)">
    <text class="count" x="160" y="132" text-anchor="middle">2枚</text>
    <text class="model" x="160" y="160" text-anchor="middle">KB-RUCR10</text>
    <use href="#carrier"/>
    <use href="#plate" x="122" y="236"/>
    <use href="#plate" x="110" y="248"/>
    <use href="#pocket2"/>
    <use href="#strap-out"/>
    <line class="blue" x1="198" y1="290" x2="272" y2="290" stroke-width="3"/>
    <circle cx="198" cy="290" r="6" fill="#1e63d6" stroke="#fff" stroke-width="2"/>
    <circle cx="272" cy="290" r="17" fill="#1e63d6"/>
    <text class="num" x="272" y="297" text-anchor="middle">1</text>
    <line class="red" x1="174" y1="410" x2="272" y2="410" stroke-width="3"/>
    <circle cx="174" cy="410" r="6" fill="#d4202a" stroke="#fff" stroke-width="2"/>
    <circle cx="272" cy="410" r="17" fill="#d4202a"/>
    <text class="num" x="272" y="417" text-anchor="middle">2</text>

    <rect x="16" y="496" width="288" height="62" rx="8" fill="#fff" stroke="#1e63d6" stroke-width="2.5"/>
    <circle cx="46" cy="527" r="16" fill="#1e63d6"/>
    <text class="num" x="46" y="534" text-anchor="middle">1</text>
    <text class="small-b" x="76" y="520">プレート</text>
    <text class="main" x="76" y="548">ポケット1に2枚</text>

    <rect x="16" y="568" width="288" height="62" rx="8" fill="#fff" stroke="#d4202a" stroke-width="2.5"/>
    <circle cx="46" cy="599" r="16" fill="#d4202a"/>
    <text class="num" x="46" y="606" text-anchor="middle">2</text>
    <text class="small-r" x="76" y="592">ストラップ</text>
    <text class="main" x="76" y="620">ポケット2の外側</text>
  </g>

  <!-- 3 plates -->
  <g transform="translate(640 0)">
    <text class="count" x="160" y="132" text-anchor="middle">3枚</text>
    <text class="model" x="160" y="160" text-anchor="middle">KB-RUCR15</text>
    <use href="#carrier"/>
    <use href="#plate" x="122" y="230"/>
    <use href="#plate" x="110" y="240"/>
    <use href="#plate" x="114" y="304"/>
    <use href="#pocket2"/>
    <use href="#strap-out"/>
    <line class="blue" x1="196" y1="262" x2="272" y2="262" stroke-width="3"/>
    <circle cx="196" cy="262" r="6" fill="#1e63d6" stroke="#fff" stroke-width="2"/>
    <circle cx="272" cy="262" r="17" fill="#1e63d6"/>
    <text class="num" x="272" y="269" text-anchor="middle">1</text>
    <line class="blue" x1="200" y1="324" x2="272" y2="324" stroke-width="3"/>
    <circle cx="200" cy="324" r="6" fill="#1e63d6" stroke="#fff" stroke-width="2"/>
    <circle cx="272" cy="324" r="17" fill="#1e63d6"/>
    <text class="num" x="272" y="331" text-anchor="middle">2</text>
    <line class="red" x1="174" y1="410" x2="272" y2="410" stroke-width="3"/>
    <circle cx="174" cy="410" r="6" fill="#d4202a" stroke="#fff" stroke-width="2"/>
    <circle cx="272" cy="410" r="17" fill="#d4202a"/>
    <text class="num" x="272" y="417" text-anchor="middle">3</text>

    <rect x="16" y="496" width="288" height="62" rx="8" fill="#fff" stroke="#1e63d6" stroke-width="2.5"/>
    <circle cx="46" cy="527" r="16" fill="#1e63d6"/>
    <text class="num" x="46" y="534" text-anchor="middle">1</text>
    <text class="small-b" x="76" y="520">プレート</text>
    <text class="main" x="76" y="548">ポケット1に2枚</text>

    <rect x="16" y="568" width="288" height="62" rx="8" fill="#fff" stroke="#1e63d6" stroke-width="2.5"/>
    <circle cx="46" cy="599" r="16" fill="#1e63d6"/>
    <text class="num" x="46" y="606" text-anchor="middle">2</text>
    <text class="small-b" x="76" y="592">プレート</text>
    <text class="main" x="76" y="620">ポケット2に1枚</text>

    <rect x="16" y="640" width="288" height="62" rx="8" fill="#fff" stroke="#d4202a" stroke-width="2.5"/>
    <circle cx="46" cy="671" r="16" fill="#d4202a"/>
    <text class="num" x="46" y="678" text-anchor="middle">3</text>
    <text class="small-r" x="76" y="664">ストラップ</text>
    <text class="main" x="76" y="692">ポケット2の外側</text>
  </g>
</svg>
